# =============================================================================
# Nginx reverse proxy para o painel web do Liga Bot
#
# OPCIONAL — só use se quiser acessar o painel via domínio público com HTTPS.
# Alternativa mais segura: SSH tunnel (ver deploy/README.md).
#
# Como usar:
#   1. Aponte um domínio (ex: bot.seudominio.com) pro IP da droplet
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/liga-bot
#   3. Edite "server_name" abaixo pro seu domínio
#   4. sudo ln -s /etc/nginx/sites-available/liga-bot /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. sudo apt install -y certbot python3-certbot-nginx
#   7. sudo certbot --nginx -d bot.seudominio.com  (HTTPS automático)
#   8. sudo ufw allow 80/tcp && sudo ufw allow 443/tcp
#
# IMPORTANTE: o painel TEM senha (WEB_PASSWORD no .env), mas mesmo assim
# expor publicamente é menos seguro que SSH tunnel. Considere se realmente precisa.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bot.seudominio.com;  # ← MUDA AQUI

    # Tamanho máximo de upload (pra screenshots de comprovantes)
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/liga-bot-access.log;
    error_log  /var/log/nginx/liga-bot-error.log;

    # Proxy pro Uvicorn (rodando em 127.0.0.1:8080 pelo systemd)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE (se um dia tiver)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (campanhas grandes podem demorar pra responder)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 30s;
    }

    # Headers de segurança básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

# Depois de rodar certbot, ele cria um segundo bloco listen 443 ssl automaticamente.
