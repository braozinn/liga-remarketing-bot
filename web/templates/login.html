<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login · Liga · Remarketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<div class="login-box">
    <div class="text-center mb-4">
        <div class="brand-mark mx-auto" style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#D97757,#E89370);display:inline-flex;align-items:center;justify-content:center;color:white;box-shadow:0 4px 14px rgba(217,119,87,0.35);">
            <i class="bi bi-send-fill" style="font-size:1.3rem;transform:rotate(-15deg);"></i>
        </div>
        <h3 class="mt-3 mb-1">Liga · Remarketing</h3>
        <p class="text-muted small mb-0">Entre com a senha do painel</p>
    </div>
    <form method="post" action="/api/login">
        <div class="mb-3">
            <label class="form-label small">Senha</label>
            <input name="password" type="password" class="form-control" autofocus required>
        </div>
        <button class="btn btn-primary w-100">
            <i class="bi bi-arrow-right-short"></i> Entrar
        </button>
    </form>
    {% if request.query_params.get('err') %}
    <div class="alert alert-danger mt-3 mb-0 small">
        <i class="bi bi-exclamation-triangle"></i> Senha incorreta.
    </div>
    {% endif %}
</div>
</body>
</html>
